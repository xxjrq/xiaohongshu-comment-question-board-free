name: xiaohongshu-comment-question-board-free
slug: xiaohongshu-comment-question-board-free
display_name: 小红书评论问答需求板
description: 在用户指定的 Easy WebBridge 浏览器环境中，只读提取一篇小红书笔记最多 20 条当前可见评论，按读者提问主题归类并统计频次，交付每条评论的可见来源位置与缺项。适用于选题、内容补洞和售前调研；评论为空、登录受限或出现验证时明确标记不可采集，绝不补写需求或频次。
version: 1.0.1
repository: https://github.com/xxjrq/xiaohongshu-comment-question-board-free
license: MIT
icon: icon-512.png
tags:
  - xiaohongshu
  - comment-analysis
  - audience-research
  - easy-webbridge
trigger_words:
  - 小红书评论问题整理
  - 笔记评论需求分析
  - 评论问答板
interface:
  display_name: "小红书评论问答需求板"
  short_description: "从用户指定的一篇笔记可见评论中整理可追溯的读者问题需求板"
  default_prompt: "使用 $xiaohongshu-comment-question-board-free，使用我指定的 browserId 和笔记页面，只读整理最多20条可见评论；输出问题分类、频次、每条来源位置和缺项。没有可见评论时请明确不可采集。"
  icon_small: "./icon-512.png"
  icon_large: "./icon-512.png"
self_test: node scripts/self-test.mjs
